name: Deploy showcase

# The showcase is a static site — everything it demonstrates runs in the
# visitor's own browser — so GitHub Pages is enough. No server is involved,
# which is the point the demo is making.
on:
  push:
    branches: [main]
    # Nothing else changes what is deployed, so nothing else needs to rebuild.
    paths:
      - "examples/react-app/**"
      - ".github/workflows/pages.yml"
  # And a button, for redeploying without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue the newer one instead of cancelling it, so
# whatever ends up live is the latest commit rather than whichever finished last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/react-app/package-lock.json

      # No Rust here: the showcase installs bitrate-js from npm like any other
      # consumer, so the WASM arrives prebuilt and inlined. That also means the
      # deployed site exercises the published package rather than a local build
      # that might differ from it.
      - name: Build the showcase
        working-directory: examples/react-app
        env:
          # Matches the repository name, which is what a project page is served
          # under. A custom domain would set this to "/".
          BASE_PATH: /bitrate-js/
        run: npm ci && npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/react-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
