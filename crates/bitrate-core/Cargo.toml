[package]
name = "bitrate-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Client-side HLS segmenter and manifest generator (WASM core for the `bitrate` npm package)"
repository = "https://github.com/OWNER/bitrate"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = []
