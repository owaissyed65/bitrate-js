<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bitrate — client-side HLS packager</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #262b36;
        --text: #e6e9ef;
        --muted: #8b93a3;
        --accent: #4f8cff;
        --ok: #3fb950;
        --err: #f85149;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 2rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 900px; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
      .sub { color: var(--muted); margin: 0 0 1.75rem; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
      }
      label.drop {
        display: block;
        border: 1.5px dashed var(--border);
        border-radius: 8px;
        padding: 2rem 1rem;
        text-align: center;
        cursor: pointer;
        color: var(--muted);
      }
      label.drop:hover { border-color: var(--accent); color: var(--text); }
      input[type="file"] { display: none; }
      .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-top: 1rem; }
      .row label { color: var(--muted); font-size: 0.9rem; }
      input[type="number"] {
        width: 5rem; background: var(--bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.5rem;
      }
      button {
        background: var(--accent); color: #fff; border: 0; border-radius: 6px;
        padding: 0.5rem 1rem; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      progress { width: 100%; height: 8px; }
      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
      th { color: var(--muted); font-weight: 500; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
      code { background: var(--bg); padding: 0.1rem 0.35rem; border-radius: 4px; }
      pre {
        background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
        padding: 0.75rem; overflow-x: auto; font-size: 0.82rem; max-height: 260px;
      }
      .stat { display: flex; gap: 2rem; flex-wrap: wrap; }
      .stat div span { display: block; color: var(--muted); font-size: 0.8rem; }
      .stat div strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
      .err { color: var(--err); }
      .ok { color: var(--ok); }
      video { width: 100%; border-radius: 8px; background: #000; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>bitrate</h1>
      <p class="sub">
        Chunk a video into seekable HLS — entirely in your browser. No server, no upload.
      </p>

      <div class="panel">
        <label class="drop" for="file">
          <strong>Choose a video</strong><br />
          MP4 with an H.264 track. Nothing leaves your machine.
        </label>
        <input id="file" type="file" accept="video/mp4,video/quicktime" />

        <div class="row">
          <label>Segment length <input id="segdur" type="number" value="6" min="1" max="30" /> s</label>
          <button id="run" disabled>Package</button>
          <span id="support" class="sub" style="margin: 0"></span>
        </div>
      </div>

      <div class="panel" id="statusPanel" hidden>
        <progress id="progress" max="100" value="0"></progress>
        <div class="stat" style="margin-top: 1rem">
          <div><span>Source</span><strong id="srcInfo">—</strong></div>
          <div><span>Segments</span><strong id="segCount">0</strong></div>
          <div><span>Output</span><strong id="outSize">0 B</strong></div>
          <div><span>Elapsed</span><strong id="elapsed">0.0 s</strong></div>
        </div>
        <p id="message" style="margin-bottom: 0"></p>
      </div>

      <div class="panel" id="playerPanel" hidden>
        <h2 style="font-size: 1rem; margin-top: 0">Playback (drag the scrubber to test seeking)</h2>
        <video id="player" controls></video>
      </div>

      <div class="panel" id="outputPanel" hidden>
        <h2 style="font-size: 1rem; margin-top: 0">Output files</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>Type</th><th class="num">Size</th></tr>
          </thead>
          <tbody id="files"></tbody>
        </table>
        <h2 style="font-size: 1rem">Playlist</h2>
        <pre id="playlist"></pre>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
