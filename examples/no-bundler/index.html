<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bitrate — no bundler</title>
    <style>
      body {
        margin: 0; padding: 2rem 1.25rem; background: #0d0f14; color: #e8ecf3;
        font: 15px/1.55 ui-sans-serif, system-ui, sans-serif; color-scheme: dark;
      }
      main { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
      p { color: #8d96a8; }
      pre {
        background: #151922; border: 1px solid #272d3a; border-radius: 8px;
        padding: 0.9rem; overflow-x: auto; font-size: 0.82rem; white-space: pre-wrap;
      }
      .ok { color: #3fb950; }
      .err { color: #f85149; }
      code { background: #151922; padding: 0.1rem 0.35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>bitrate without a bundler</h1>
      <p>
        No Vite, no webpack — just an import map and a <code>&lt;script type="module"&gt;</code>.
        This works because the package is a single ESM file with the WASM embedded in it.
      </p>
      <pre id="out">running…</pre>
    </main>

    <!--
      An import map teaches the browser what a bare specifier means. Without one,
      `import "bitrate-js"` fails with "Failed to resolve module specifier".
    -->
    <script type="importmap">
      {
        "imports": {
          "bitrate-js": "../../js/dist/index.js"
        }
      }
    </script>

    <script type="module">
      import { isSupported, inspect, remux } from "bitrate-js";

      const out = document.getElementById("out");
      const log = (text, cls = "") => {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = `${text}\n`;
        out.appendChild(span);
      };

      out.textContent = "";
      try {
        log("import via import map: OK", "ok");

        const support = isSupported();
        log(`isSupported(): remux=${support.remux} transcode=${support.transcode}`);

        // A generated sample lives alongside the other demo.
        const blob = await fetch("../demo/public/sample-audio.mp4").then((r) => r.blob());
        const file = new File([blob], "sample-audio.mp4", { type: "video/mp4" });

        const info = await inspect(file);
        log(`inspect(): ${info.width}x${info.height}, ${info.duration.toFixed(1)}s, audio=${info.hasAudio}`);

        let files = 0;
        let bytes = 0;
        const started = performance.now();
        for await (const item of remux(file, { prefix: "nb", segmentDuration: 6 })) {
          files++;
          bytes += item.blob.size;
        }
        log(`remux(): ${files} files, ${(bytes / 1024).toFixed(0)} KB, ${(performance.now() - started).toFixed(0)} ms`);
        log("the package works with no build step at all", "ok");
      } catch (error) {
        log(`failed: ${error.message}`, "err");
      }
    </script>
  </body>
</html>
